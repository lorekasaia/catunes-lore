name: Build Android launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A fixed debug keystore, checked into the repo, so every build is
      # signed the same way — otherwise Android refuses to install an
      # update over a previous build signed with a different, randomly
      # generated debug key ("package conflicts with an existing package").
      - name: Generate the shared debug keystore (once)
        run: |
          mkdir -p android/keystore
          if [ ! -f android/keystore/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/keystore/debug.keystore \
              -alias catunes -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass catunes123 -keypass catunes123 \
              -dname "CN=catunes, OU=catunes, O=lorekasaia, L=Unknown, S=Unknown, C=US"
          fi

      - name: Persist the keystore if it was just created
        run: |
          if [ -n "$(git status --porcelain android/keystore/debug.keystore)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add android/keystore/debug.keystore
            git commit -m "Add stable debug keystore for reproducible APK signing [skip ci]"
            git push
          fi

      # ubuntu-latest runners already ship an Android SDK; use it directly
      # instead of a third-party action (which currently fails to fetch
      # cmdline-tools after Google's download URL change).
      - name: Install SDK platform & build-tools
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: catunes-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
